<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião da Rotina — Acesso</title>
<style>
  :root {
    --verde: #2D6A4F;
    --verde-escuro: #1B4332;
    --verde-suave: #D8F3DC;
    --branco: #FFFFFF;
    --fundo: #F7F9F7;
    --texto: #1a1a1a;
    --texto-muted: #6b7178;
    --erro: #b00020;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    background: var(--branco);
    border-radius: 16px;
    padding: 36px 28px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .foto {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid var(--verde);
    object-fit: cover;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--verde);
    margin: 0 0 10px;
  }

  .subtitulo {
    font-size: 14px;
    color: var(--texto-muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  form {
    width: 100%;
  }

  input[type="password"] {
    width: 100%;
    border: 1.5px solid #dcdfe4;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    color: var(--texto);
    margin-bottom: 14px;
  }

  input[type="password"]:focus {
    outline: 2px solid var(--verde);
    outline-offset: 1px;
    border-color: var(--verde);
  }

  .btn-principal {
    width: 100%;
    background: var(--verde);
    color: var(--branco);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .btn-principal:hover {
    background: var(--verde-escuro);
  }

  .erro {
    display: none;
    color: var(--erro);
    font-size: 13px;
    margin: -4px 0 14px;
    text-align: left;
  }

  .erro.visivel {
    display: block;
  }

  .versao-pergunta {
    font-size: 16px;
    font-weight: 600;
    color: var(--texto);
    margin: 0 0 24px;
  }

  .opcoes-versao {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn-versao {
    width: 100%;
    background: var(--verde);
    color: var(--branco);
    border: none;
    border-radius: 12px;
    padding: 18px 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s ease;
    text-decoration: none;
  }

  .btn-versao:hover {
    background: var(--verde-escuro);
  }

  .btn-versao .icone {
    font-size: 22px;
    line-height: 1;
  }

  .aviso-mobile {
    display: none;
    margin-top: 16px;
    width: 100%;
    background: var(--verde-suave);
    color: var(--verde);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
  }

  .aviso-mobile.visivel {
    display: block;
  }

  #tela-versao {
    display: none;
  }

  .btn-sair {
    background: none;
    border: none;
    color: var(--texto-muted);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 28px;
    padding: 6px 10px;
    text-decoration: underline;
  }

  .btn-sair:hover {
    color: var(--texto);
  }

  .rodape {
    margin-top: 20px;
    font-size: 12px;
    color: var(--texto-muted);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="container">

    <!-- Tela 1 — Login -->
    <div id="tela-login" class="card">
      <img class="foto" src="banco-imagens/foto-isabel.jpeg" alt="Foto de Isabel">
      <h1>Guardião da Rotina</h1>
      <p class="subtitulo">O painel de rotina visual criado especialmente para o seu filho.</p>

      <form id="form-login" autocomplete="off">
        <input type="password" id="campo-senha" placeholder="Digite a senha" autocomplete="off">
        <p id="msg-erro" class="erro">Senha incorreta. Tente novamente.</p>
        <button type="submit" class="btn-principal">Entrar</button>
      </form>
    </div>

    <!-- Tela 2 — Seleção de versão -->
    <div id="tela-versao" class="card">
      <p class="versao-pergunta">Como você está acessando agora?</p>

      <div class="opcoes-versao">
        <a href="dist/guardiao-da-rotina.html" target="_blank" rel="noopener" class="btn-versao" id="btn-computador">
          <span class="icone">💻</span>
          <span>No computador</span>
        </a>
        <button type="button" class="btn-versao" id="btn-celular">
          <span class="icone">📱</span>
          <span>No celular</span>
        </button>
      </div>

      <p id="aviso-mobile" class="aviso-mobile">A versão mobile está em construção. Por enquanto, use a versão computador. 💚</p>

      <button type="button" class="btn-sair" id="btn-sair">Sair</button>
    </div>

    <p class="rodape">Isabel Salvadori · MIIRTUS</p>

  </div>

<script>
  (function () {
    var SENHA_CORRETA = 'meuguardiao';

    var telaLogin = document.getElementById('tela-login');
    var telaVersao = document.getElementById('tela-versao');
    var formLogin = document.getElementById('form-login');
    var campoSenha = document.getElementById('campo-senha');
    var msgErro = document.getElementById('msg-erro');
    var btnCelular = document.getElementById('btn-celular');
    var avisoMobile = document.getElementById('aviso-mobile');
    var btnSair = document.getElementById('btn-sair');

    formLogin.addEventListener('submit', function (e) {
      e.preventDefault();
      tentarLogin();
    });

    campoSenha.addEventListener('input', function () {
      msgErro.classList.remove('visivel');
    });

    function tentarLogin() {
      if (campoSenha.value === SENHA_CORRETA) {
        msgErro.classList.remove('visivel');
        telaLogin.style.display = 'none';
        telaVersao.style.display = 'flex';
      } else {
        msgErro.classList.add('visivel');
      }
    }

    btnCelular.addEventListener('click', function () {
      avisoMobile.classList.add('visivel');
    });

    btnSair.addEventListener('click', function () {
      telaVersao.style.display = 'none';
      telaLogin.style.display = 'flex';
      campoSenha.value = '';
      msgErro.classList.remove('visivel');
      avisoMobile.classList.remove('visivel');
    });
  })();
</script>

</body>
</html>
